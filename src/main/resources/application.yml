spring:
  application:
    name: demcayniki-api

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  web:
    error:
      include-message: always

server:
  port: 8080

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

security:
  jwt:
    issuer: ${JWT_ISSUER:demcayniki-api}
    audience: ${JWT_AUDIENCE:demcayniki-clients}
    expiration-minutes: ${JWT_EXP_MINUTES:10}
    key-id: ${JWT_KID:dev-1}
    public-key-location: ${JWT_PUBLIC_KEY:classpath:keys/jwt_public.pem}

security-refresh:
  expiration-days: ${REFRESH_EXP_DAYS:14}
